services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-local
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Dhaka}
      - TZ=${TZ:-Asia/Dhaka}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      # Execution history pruning (prevents database from ballooning during testing)
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=50000
      # Allow code nodes to use built-in & external libraries
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      # Optional: set encryption key for reproducible credential backups
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Dashboard Database ───────────────────────────────────────────────────────
  dashboard-db:
    image: postgres:16-alpine
    container_name: dashboard-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard_secret
      POSTGRES_DB: dashboard_db
    volumes:
      - dashboard_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dashboard-init:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      target: builder
    container_name: dashboard-init
    depends_on:
      dashboard-db:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push --accept-data-loss"
    environment:
      - DATABASE_URL=postgresql://dashboard:dashboard_secret@dashboard-db:5432/dashboard_db

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://dashboard:dashboard_secret@dashboard-db:5432/dashboard_db
      - BETTER_AUTH_SECRET=change-me-to-a-random-secret-at-least-32-chars
      - BETTER_AUTH_URL=http://localhost:3000
      - N8N_WEBHOOK_URL=http://n8n:5678
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - WEBHOOK_SECRET=n8n-dashboard-shared-secret-change-me
    depends_on:
      dashboard-db:
        condition: service_healthy
volumes:
  n8n_data:
    name: n8n_local_data
  dashboard_db_data:
    name: dashboard_db_data
